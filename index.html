<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Jogo da cobrinha minimalista que guarda o seu recorde.">
  <meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1217" media="(prefers-color-scheme: dark)">
  <title>Snake</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b2230'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ff4d2e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <main class="app">
    <header class="hud">
      <div class="stat"><span class="label">Maçãs</span><strong id="score">0</strong></div>
      <h1>snake</h1>
      <div class="stat right"><span class="label">Recorde</span><strong id="best">0</strong></div>
    </header>

    <div class="board" id="board">
      <canvas id="canvas" aria-label="Tabuleiro do jogo"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="title">Snake</h2>
        <p id="text"></p>
        <div class="options" id="options">
          <div class="seg" id="difficulty" role="group" aria-label="Dificuldade">
            <button type="button" data-diff="easy">Fácil</button>
            <button type="button" data-diff="normal">Normal</button>
            <button type="button" data-diff="hard">Difícil</button>
          </div>
          <button type="button" class="toggle" id="walls"></button>
        </div>
        <button type="button" class="primary" id="play">Jogar</button>
        <p class="totals" id="totals" hidden></p>
      </div>
    </div>

    <footer class="hint">Setas ou WASD movem, espaço pausa.</footer>
  </main>
</body>
</html>
